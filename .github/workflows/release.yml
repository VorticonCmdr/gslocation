name: Build & Release Extension

on:
  push:
    tags:
      - 'v*'   # Triggert bei jedem Tag wie v3.7, v3.8 etc.

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Chrome- und Firefox-ZIPs bauen
        run: node scripts/build.mjs --zip

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          files: dist/gslocation-*.zip
          generate_release_notes: true  # Erstellt automatisch Changelog aus Commits
